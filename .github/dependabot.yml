# Mantiene al día las dependencias npm y las actions pineadas por SHA.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      menores-y-patch:
        update-types: ['minor', 'patch']
    ignore:
      # @astrojs/check solo acepta typescript ^5 || ^6 como peer; subir la
      # major a mano cuando Astro la soporte (ver PR #11).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
